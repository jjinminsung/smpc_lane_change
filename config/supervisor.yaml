confirmation_count: 3
ego_front_extent_m: 3.845
ego_rear_extent_m: 0.790
cooldown_sec: 3.0
lane_change_duration_sec: 4.2

# Completion is no longer just "4 seconds elapsed".  The supervisor confirms
# that ego is actually established on the target lane CSV before closing the
# lane-change window.
completion_use_pose_check: true
completion_min_active_sec: 2.0
completion_timeout_sec: 8.0
completion_lateral_d_m: 0.75   # Final completion uses CSV lateral distance only.
completion_confirmation_count: 5

# At completion_timeout_sec, classify the actual ego pose instead of forcing
# success.  Complete/failed decisions use CSV distance.  Yaw is only appended
# to ambiguous in-progress/debug states so post-change oscillation does not
# block completion.
completion_aligning_lateral_d_m: 1.35
completion_aligning_yaw_error_rad: 0.60   # Debug classification only.
completion_failed_source_lateral_d_m: 0.90
completion_lane_distance_margin_m: 0.30
completion_hard_timeout_sec: 0.0   # 0 disables forced completion.

# A CHANGE_LEFT command immediately switches /path_number, even from rest at a
# source-path endpoint.  Do not start the maneuver-completion timeout until
# the target path switch is acknowledged and the vehicle actually progresses.
# /final_waypoint is the path that MPC consumes; four points is its minimum
# polyfit requirement.
final_waypoint_topic: "/final_waypoint"
target_path_min_points: 4
path_switch_timeout_sec: 2.0       # target /gps_state + usable /final_waypoint
motion_start_speed_mps: 0.20
motion_start_displacement_m: 0.30
motion_start_timeout_sec: 0.0      # 0: do not fail an intentional standstill

# Active lane-change rear-intrusion guard.  A rear vehicle that appears after
# path switch must still be checked over the remaining lateral-manoeuvre time.
# If a modest forward escape cannot retain this margin, return to the source
# lane only while ego is still on the source side of the lane midpoint.
active_rear_guard_enabled: true
active_rear_guard_min_gap_m: 9.0
active_rear_guard_min_ttc_sec: 3.0
# Use the same closing-speed rear margin as SMPC. The 9 m floor, 3 s TTC,
# and remaining-manoeuvre projection still protect a rapidly approaching rear.
active_rear_guard_min_headway_sec: 1.2
active_rear_guard_escape_accel_mps2: 2.0
active_rear_guard_front_min_gap_m: 10.0
active_rear_guard_front_min_headway_sec: 1.2
active_rear_guard_abort_before_target_center_abs_d_m: 1.75
active_rear_guard_min_remaining_sec: 0.30
# Use measured target-lane lateral progress, not elapsed blend time. If ego is
# stopped or target-d is not decreasing, expose the rear gate to 8 s.
active_rear_guard_perception_control_delay_sec: 0.50
active_rear_guard_stationary_remaining_sec: 8.0
active_rear_guard_max_remaining_sec: 10.0
active_rear_guard_min_lateral_rate_mps: 0.05
active_rear_guard_lateral_rate_alpha: 0.30
# A close new ID is immediately treated with a conservative closing speed;
# this covers the velocity-estimator warm-up seen in lc_collision_02.bag.
active_rear_guard_new_track_guard_sec: 0.80
active_rear_guard_new_track_max_gap_m: 40.0
active_rear_guard_new_track_closing_upper_mps: 15.0
# Ignore a one-frame ID/role association jump. Confirm ordinary rear danger
# for both a short time and several target updates; truly critical proximity
# still aborts immediately.
active_rear_guard_abort_confirmation_sec: 0.30
active_rear_guard_abort_confirmation_count: 3
active_rear_guard_emergency_gap_m: 4.0
active_rear_guard_emergency_ttc_sec: 1.0

# Safety guards for bad lane/path association.
# If ego is not reasonably near the source/target CSVs, do not start or keep a
# lane-change active window.  This prevents a wrong /path_number from leaving
# /local_path with only 1~3 points and freezing MPC in path-end stop.
accept_source_max_abs_d_m: 4.0
accept_target_max_abs_d_m: 6.0
timeout_off_active_lanes_abs_d_m: 6.0
recovery_nearest_lane_max_abs_d_m: 6.0
odom_topic: "/odom"
